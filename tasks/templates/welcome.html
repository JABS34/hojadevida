<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #020617; width: 100%; height: 100%; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        
        .hero-content { 
            position: relative; z-index: 10; pointer-events: none;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .hero-content button { pointer-events: auto; }

        /* --- SECCIÓN SELECCIONAR PERFIL (DISEÑO ESPACIAL) --- */
        #profile-selector {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: #020617;
            overflow: hidden;
        }

        /* Fondo Animado de Estrellas/Nebulosa */
        .stars-container {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
            z-index: -1;
        }

        /* Tarjetas Estilo Cristal Moderno */
        .profile-card-new {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 320px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .profile-card-new:hover {
            transform: translateY(-15px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        /* Corregido el error de object-cover */
        .img-glow {
            width: 140px; height: 140px; margin: 0 auto 25px;
            border-radius: 50%; padding: 5px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
        
        .img-glow img { 
            width: 100%; height: 100%; border-radius: 50%; 
            object-fit: cover; /* CORRECCIÓN AQUÍ */
            border: 4px solid #0f172a; 
        }

        .btn-modern {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 12px; font-weight: 800; letter-spacing: 1px;
            padding: 12px 0; color: white; width: 100%;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-modern:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }

        .explosion-emoji {
            position: absolute; pointer-events: none; z-index: 50;
            font-size: 2.5rem; animation: emojiAnim 0.8s ease-out forwards;
        }

        @keyframes emojiAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.8) rotate(20deg) translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body class="text-white">

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector">
        <div class="stars-container"></div>
        <h2 class="text-5xl font-black mb-16 tracking-tight text-white drop-shadow-2xl">
            Selecciona un Perfil
        </h2>
        <div class="flex flex-wrap justify-center gap-12 z-10">
            {% for perfil in perfiles_activos %}
            <div class="profile-card-new group">
                <div class="img-glow">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}" alt="Foto">
                    {% else %}
                        <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center text-4xl">👤</div>
                    {% endif %}
                </div>
                <h3 class="text-2xl font-bold text-white mb-8">{{ perfil.nombres }}</h3>
                <button onclick="goToProfile('{{ perfil.user.username }}')" class="btn-modern">
                    MIRA MI CV
                </button>
            </div>
            {% endfor %}
        </div>
        <button onclick="document.getElementById('profile-selector').style.display='none'" class="mt-16 text-slate-400 hover:text-white transition-all text-sm uppercase tracking-widest">
            ← Volver al inicio
        </button>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center">
        <div id="canvas-3d"></div> 
        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white to-indigo-400">
                Bienvenido a Mi CV <br>Profesional
            </h1>
            <p class="text-slate-300 text-xl md:text-2xl font-light mb-12 max-w-2xl mx-auto italic">
                Te invito a explorar mi trayectoria, mis proyectos y las habilidades que he cultivado.
            </p>
            <button onclick="handleCVAction()" class="px-12 py-6 bg-indigo-600 rounded-2xl font-black text-2xl shadow-[0_15px_0_rgb(49,46,129)] hover:translate-y-1 active:shadow-none active:translate-y-[15px] transition-all">
                Mira mi CV aquí 👇
            </button>
        </div>
    </section>

    <script>
        // Función de Explosión mejorada
        function triggerEmoji(x, y) {
            const emojis = ['🚀', '💻', '🐍', '🔥', '⚡', '✨'];
            for(let i=0; i<8; i++) {
                const span = document.createElement('span');
                span.className = 'explosion-emoji';
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = x + (Math.random() * 40 - 20) + 'px';
                span.style.top = y + (Math.random() * 40 - 20) + 'px';
                document.body.appendChild(span);
                setTimeout(() => span.remove(), 800);
            }
        }

        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) goToProfile(user);
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        function goToProfile(username) {
            document.getElementById('ui-wrapper').style.opacity = "0";
            document.getElementById('ui-wrapper').style.transform = "scale(0.8)";
            document.getElementById('ui-wrapper').style.transition = "all 0.6s ease";
            setTimeout(() => { window.location.href = "/perfil/" + username + "/"; }, 600);
        }

        // --- MOTOR 3D ORIGINAL + INTERACTIVO ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const indigoMat = new THREE.MeshPhongMaterial({ color: 0x4338ca, wireframe: true, transparent: true, opacity: 0.4 });
        
        function createCodeBlock(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = '#818cf8';
            ctx.font = 'Bold 44px monospace';
            ctx.fillText(text, 20, 80);
            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
        }

        const codes = ["def push_code():", "import sqlite3", "render(request)", "os.path.join()", "class Meta:"];

        for(let i=0; i<35; i++) {
            let obj;
            if(i < 12) obj = createCodeBlock(codes[i % codes.length]);
            else {
                const geo = i % 2 === 0 ? new THREE.IcosahedronGeometry(Math.random()*2, 0) : new THREE.BoxGeometry(2,2,2);
                obj = new THREE.Mesh(geo, indigoMat);
            }
            obj.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, (Math.random()-0.5)*20);
            obj.userData = { velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.02), isDragging: false };
            scene.add(obj);
            objects.push(obj);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        camera.position.z = 28;

        const drag = new THREE.DragControls(objects, camera, renderer.domElement);
        drag.addEventListener('dragstart', (e) => { e.object.userData.isDragging = true; });
        drag.addEventListener('dragend', (e) => { e.object.userData.isDragging = false; });

        window.addEventListener('click', (e) => {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);
            if(intersects.length > 0) {
                triggerEmoji(e.clientX, e.clientY);
                intersects[0].object.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, 0);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                if (!obj.userData.isDragging) {
                    obj.position.add(obj.userData.velocity);
                    obj.rotation.x += 0.005; obj.rotation.y += 0.005;
                    if (Math.abs(obj.position.x) > 40) obj.userData.velocity.x *= -1;
                    if (Math.abs(obj.position.y) > 25) obj.userData.velocity.y *= -1;
                }
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
