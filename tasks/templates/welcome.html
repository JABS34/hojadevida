<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');

        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #020617; width: 100%; height: 100%; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        
        .hero-content { 
            position: relative; 
            z-index: 10; 
            pointer-events: none;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
        .hero-content button { pointer-events: auto; font-family: 'Syncopate', sans-serif; }

        /* DISEÑO DE TARJETAS NEOMORFISTA / CYBERPUNK */
        .profile-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 320px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #6366f1);
            animation: rotate-border 4s linear infinite;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .profile-card:hover::before { opacity: 1; }

        .profile-card:hover {
            transform: translateY(-15px) rotateX(10deg);
            border-color: #818cf8;
            box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.4);
        }

        @keyframes rotate-border {
            100% { transform: rotate(360deg); }
        }

        .profile-img-container {
            width: 150px; height: 150px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        /* SELECTOR DE PERFIL */
        #profile-selector {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(7, 10, 25, 0.95), #020617);
            z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }

        .btn-action {
            background: #6366f1;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: all 0.3s;
        }
        .btn-action:hover {
            background: #818cf8;
            padding-left: 20px; padding-right: 20px;
            filter: drop-shadow(0 0 10px #6366f1);
        }

        .explosion-emoji {
            position: absolute; pointer-events: none; z-index: 50;
            font-size: 2rem; animation: float-up 1s ease-out forwards;
        }

        @keyframes float-up {
            0% { transform: scale(0) translateY(0); opacity: 1; }
            100% { transform: scale(2) translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body class="text-white">

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector" class="p-8">
        <h2 class="text-5xl font-black mb-16 tracking-tighter italic text-indigo-400">ACCESS_GRANTED.SYS</h2>
        <div class="flex flex-wrap justify-center gap-12">
            {% for perfil in perfiles_activos %}
            <div class="profile-card group">
                <div class="profile-img-container">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}" class="w-full h-full rounded-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500">
                    {% else %}
                        <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center text-5xl">👤</div>
                    {% endif %}
                </div>
                <h3 class="text-2xl font-bold mb-6 tracking-widest uppercase">{{ perfil.nombres }}</h3>
                <button onclick="goToProfile('{{ perfil.user.username }}')" class="btn-action w-full py-4 font-black text-sm italic">
                    INITIALIZE_CV
                </button>
            </div>
            {% endfor %}
        </div>
        <button onclick="document.getElementById('profile-selector').style.display='none'" class="mt-16 text-xs tracking-[0.5em] text-slate-500 hover:text-white transition-all uppercase">Terminar Sesión</button>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center">
        <div id="canvas-3d"></div> 

        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-7xl md:text-9xl font-black tracking-tighter mb-4 italic uppercase">
                PORTFOLIO<span class="text-indigo-500">2026</span>
            </h1>
            <p class="text-indigo-300/60 text-lg md:text-xl font-bold mb-12 tracking-[0.3em] uppercase">Digital Experience Architect</p>

            <button onclick="handleCVAction()" class="group relative px-12 py-6 bg-transparent border-2 border-indigo-500 overflow-hidden transition-all duration-500 hover:border-white">
                <span class="relative z-10 font-black italic group-hover:text-black">ENTER_SYSTEM</span>
                <div class="absolute inset-0 bg-white translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
            </button>
        </div>
    </section>

    <script>
        // --- LÓGICA DE EXPLOSIÓN DE EMOJIS ---
        function createEmojiExplosion(x, y) {
            const emojis = ['🚀', '💻', '🔥', '✨', '⚡️', '🌈', '💎', '👾', '👑'];
            for(let i=0; i<8; i++) {
                const span = document.createElement('span');
                span.className = 'explosion-emoji';
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = x + (Math.random() - 0.5) * 100 + 'px';
                span.style.top = y + (Math.random() - 0.5) * 100 + 'px';
                document.body.appendChild(span);
                setTimeout(() => span.remove(), 1000);
            }
        }

        // --- LÓGICA DE NAVEGACIÓN ---
        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) goToProfile(user);
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        function goToProfile(username) {
            document.body.classList.add('explosion-out'); // Tu efecto de explosión anterior
            setTimeout(() => { window.location.href = "/perfil/" + username + "/"; }, 800);
        }

        // --- MOTOR 3D CON FÍSICA DE LANZAMIENTO Y REBOTE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();

        // Materiales
        const mats = [
            new THREE.MeshPhongMaterial({ color: 0x6366f1, wireframe: true }),
            new THREE.MeshStandardMaterial({ color: 0x4338ca, metalness: 0.8, roughness: 0.2 })
        ];

        // Crear objetos flotantes
        for(let i=0; i<30; i++) {
            const geo = i % 2 === 0 ? new THREE.IcosahedronGeometry(1.5, 0) : new THREE.TorusGeometry(1, 0.4, 16, 32);
            const mesh = new THREE.Mesh(geo, mats[i % 2]);
            
            mesh.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*30, (Math.random()-0.5)*10);
            
            // Propiedades de física
            mesh.userData = {
                velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.05),
                isDragging: false,
                lastPosition: new THREE.Vector3()
            };
            
            scene.add(mesh);
            objects.push(mesh);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.PointLight(0x6366f1, 2, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        camera.position.z = 25;

        // Drag Controls con lanzamiento
        const drag = new THREE.DragControls(objects, camera, renderer.domElement);
        
        drag.addEventListener('dragstart', (e) => {
            e.object.userData.isDragging = true;
        });

        drag.addEventListener('drag', (e) => {
            // Calcular velocidad basada en el movimiento del mouse
            const currentPos = e.object.position.clone();
            e.object.userData.velocity.subVectors(currentPos, e.object.userData.lastPosition).multiplyScalar(0.8);
            e.object.userData.lastPosition.copy(currentPos);
        });

        drag.addEventListener('dragend', (e) => {
            e.object.userData.isDragging = false;
        });

        // Click para explotar
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                createEmojiExplosion(e.clientX, e.clientY);
                
                // Efecto de "empuje" al explotar
                obj.scale.set(0,0,0);
                setTimeout(() => {
                    obj.scale.set(1,1,1);
                    obj.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*30, 0);
                }, 1500);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            objects.forEach(obj => {
                if (!obj.userData.isDragging) {
                    // Aplicar velocidad
                    obj.position.add(obj.userData.velocity);
                    obj.rotation.x += 0.01;
                    obj.rotation.y += 0.01;

                    // Límites y rebote (Pantalla)
                    if (Math.abs(obj.position.x) > 25) obj.userData.velocity.x *= -1.1; // Rebote con un poco de energía
                    if (Math.abs(obj.position.y) > 18) obj.userData.velocity.y *= -1.1;
                    
                    // Fricción ambiental para que no aceleren infinitamente
                    obj.userData.velocity.multiplyScalar(0.995);
                }
                obj.userData.lastPosition.copy(obj.position);
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
