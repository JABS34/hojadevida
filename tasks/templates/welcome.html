<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; width: 100%; height: 100%; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        #canvas-3d:active { cursor: grabbing; }
        
        .hero-content { 
            position: relative; z-index: 10; pointer-events: none;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .hero-content button { pointer-events: auto; }

        /* --- SELECTOR DE PERFIL (GATOS PIXEL) --- */
        #profile-selector {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            overflow: hidden;
        }

        .pixel-cat-sprite {
            position: absolute; width: 80px; height: 80px;
            image-rendering: pixelated; pointer-events: none; z-index: 5;
        }

        .profile-card-pixel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 30px;
            padding: 40px;
            width: 320px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .profile-card-pixel:hover { transform: scale(1.1); border-color: #818cf8; box-shadow: 0 0 40px rgba(99, 102, 241, 0.2); }

        .img-container {
            width: 140px; height: 140px; margin: 0 auto 25px;
            border-radius: 50%; border: 4px solid #6366f1; overflow: hidden;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-vibrate {
            background: #6366f1; color: white; padding: 14px; border-radius: 12px;
            width: 100%; font-weight: 900; transition: all 0.2s;
        }
        .btn-vibrate:hover { animation: vibrate 0.1s linear infinite; background: #4f46e5; }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }

        /* Explosiones */
        .emoji-particle { position: absolute; pointer-events: none; z-index: 200; font-size: 2rem; animation: floatUp 0.8s ease-out forwards; }
        .pixel-particle { position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 200; }

        @keyframes floatUp {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector">
        <div id="cat-field" class="absolute inset-0"></div>
        <h2 class="text-5xl font-black mb-16 text-white z-10 italic">SELECCIONA PERFIL</h2>
        <div class="flex flex-wrap justify-center gap-10 z-10">
            {% for perfil in perfiles_activos %}
            <div class="profile-card-pixel">
                <div class="img-container">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}">
                    {% else %}
                        <div class="w-full h-full bg-slate-800 flex items-center justify-center text-5xl">👤</div>
                    {% endif %}
                </div>
                <h3 class="text-2xl font-bold text-white mb-8">{{ perfil.nombres }}</h3>
                <button onclick="mineExplode(event, '{{ perfil.user.username }}')" class="btn-vibrate">MIRA MI CV</button>
            </div>
            {% endfor %}
        </div>
        <button onclick="document.getElementById('profile-selector').style.display='none'" class="mt-12 text-slate-500 hover:text-white transition-colors z-10">Cerrar</button>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center overflow-hidden">
        <div id="canvas-3d"></div> 
        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white to-indigo-500 select-none italic">
                Bienvenido a Mi CV <br>Profesional
            </h1>
            <p class="text-slate-300 text-xl md:text-2xl font-medium mb-12 max-w-2xl mx-auto select-none italic">
                Interactúa con el entorno y descubre mi trayectoria.
            </p>
            <button onclick="handleCVAction()" class="px-14 py-7 bg-indigo-600 text-white rounded-3xl font-black text-2xl shadow-[0_12px_0_rgb(49,46,129)] hover:translate-y-1 active:translate-y-[12px] active:shadow-none transition-all">
                EMPEZAR 👇
            </button>
        </div>
    </section>

    <script>
        // --- LÓGICA GATOS PIXEL ---
        const catField = document.getElementById('cat-field');
        const cats = [
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pwa3N6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o72EX5QZ9N9d51dq0/giphy.gif',
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pwa3N6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/JIX9t2j0ZTN9S/giphy.gif',
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pwa3N6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26vUAAOEj6P8uT3C8/giphy.gif'
        ];

        for(let i=0; i<8; i++){
            const cat = document.createElement('img');
            cat.src = cats[i % cats.length];
            cat.className = 'pixel-cat-sprite';
            cat.style.left = Math.random() * 90 + '%';
            cat.style.top = Math.random() * 90 + '%';
            catField.appendChild(cat);
            setInterval(() => {
                cat.style.left = (parseFloat(cat.style.left) + (Math.random() - 0.5) * 10) + '%';
                cat.style.top = (parseFloat(cat.style.top) + (Math.random() - 0.5) * 10) + '%';
            }, 2000);
        }

        // --- EXPLOSIONES ---
        function emojiExplode(x, y) {
            const emojis = ['🚀', '💻', '🔥', '✨', '⚡', '🐍'];
            for(let i=0; i<8; i++){
                const e = document.createElement('span');
                e.className = 'emoji-particle';
                e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
                e.style.left = x + 'px'; e.style.top = y + 'px';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 800);
            }
        }

        function mineExplode(e, user) {
            const r = e.target.getBoundingClientRect();
            const x = r.left + r.width/2; const y = r.top + r.height/2;
            for(let i=0; i<30; i++){
                const b = document.createElement('div');
                b.className = 'pixel-particle';
                b.style.left = x + 'px'; b.style.top = y + 'px';
                b.style.backgroundColor = ['#6366f1', '#ffffff', '#312e81'][Math.floor(Math.random()*3)];
                document.body.appendChild(b);
                const a = Math.random()*Math.PI*2; const d = 100+Math.random()*150;
                b.animate([{transform:'translate(0,0) scale(1)', opacity:1},{transform:`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px) scale(0)`, opacity:0}], {duration:600, easing:'steps(6)'});
                setTimeout(() => b.remove(), 600);
            }
            setTimeout(() => window.location.href = "/perfil/" + user + "/", 500);
        }

        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) window.location.href = "/perfil/" + user + "/";
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        // --- MOTOR 3D (Lógica exacta del código 1) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const indigoMat = new THREE.MeshPhongMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.3 });
        const particleMat = new THREE.PointsMaterial({ color: 0x818cf8, size: 0.05 });

        // Partículas de fondo
        const partGeo = new THREE.BufferGeometry();
        const partCount = 1500;
        const posArray = new Float32Array(partCount * 3);
        for(let i=0; i < partCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 100;
        partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particles = new THREE.Points(partGeo, particleMat);
        scene.add(particles);

        function createCodeBlock(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = '#6366f1';
            ctx.font = 'Bold 40px monospace';
            ctx.fillText(text, 20, 80);
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
            return new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5), mat);
        }

        const codes = ["python manage.py", "git push origin", "docker-compose up", "npm install", "SELECT * FROM"];

        for(let i=0; i<40; i++) {
            let obj;
            if(i < 15) obj = createCodeBlock(codes[i % codes.length]);
            else {
                const geo = i % 2 === 0 ? new THREE.IcosahedronGeometry(Math.random()*2, 0) : new THREE.TorusGeometry(1, 0.3, 16, 32);
                obj = new THREE.Mesh(geo, indigoMat);
            }
            obj.position.set((Math.random()-0.5)*60, (Math.random()-0.5)*40, (Math.random()-0.5)*30);
            obj.userData = { 
                velocity: new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05, (Math.random()-0.5)*0.02),
                rotSpeed: Math.random() * 0.01,
                isDragging: false 
            };
            scene.add(obj);
            objects.push(obj);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pointLight = new THREE.PointLight(0x6366f1, 2);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);
        camera.position.z = 30;

        // Arrastre e Interacción
        const drag = new THREE.DragControls(objects, camera, renderer.domElement);
        drag.addEventListener('dragstart', (e) => { e.object.userData.isDragging = true; });
        drag.addEventListener('dragend', (e) => { e.object.userData.isDragging = false; });

        window.addEventListener('mousedown', (e) => {
            const ray = new THREE.Raycaster();
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            ray.setFromCamera(mouse, camera);
            const inter = ray.intersectObjects(objects);
            if(inter.length > 0) {
                emojiExplode(e.clientX, e.clientY);
                inter[0].object.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, 0);
            }
        });

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 100;
            mouseY = (e.clientY - window.innerHeight / 2) / 100;
        });

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.001;
            objects.forEach(obj => {
                if(!obj.userData.isDragging) {
                    obj.position.add(obj.userData.velocity);
                    obj.rotation.x += obj.userData.rotSpeed;
                    obj.rotation.y += obj.userData.rotSpeed;
                    if (Math.abs(obj.position.x) > 40) obj.userData.velocity.x *= -1;
                    if (Math.abs(obj.position.y) > 30) obj.userData.velocity.y *= -1;
                }
            });
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
