<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Estilos Base */
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #1e293b; width: 100%; height: 100%; font-family: sans-serif; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        
        .hero-content { 
            position: relative; z-index: 10; pointer-events: none;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }
        .hero-content button { pointer-events: auto; }

        /* SECCIÓN SELECTOR DE PERFIL */
        #profile-selector {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #2e1065 0%, #020617 100%);
        }

        /* Gatos Pixel Animados en el Fondo */
        .pixel-cat {
            position: absolute; width: 64px; height: 64px;
            image-rendering: pixelated;
            pointer-events: none; z-index: 1;
            opacity: 0.7;
        }

        /* Recuadros con Zoom */
        .profile-card-pixel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 4px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 280px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .profile-card-pixel:hover { transform: scale(1.1); border-color: #818cf8; }

        .img-container {
            width: 120px; height: 120px; margin: 0 auto 20px;
            border-radius: 50%; border: 4px solid #6366f1; overflow: hidden;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Botón con Vibración */
        .btn-vibrate {
            background: #6366f1; color: white; padding: 12px; border-radius: 10px;
            width: 100%; font-weight: bold; transition: all 0.2s;
        }
        .btn-vibrate:hover {
            animation: vibrate 0.1s linear infinite;
            background: #4f46e5;
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }

        /* Partículas Pixel (Minecraft Style) */
        .pixel-particle {
            position: absolute; width: 15px; height: 15px;
            background: #6366f1; pointer-events: none; z-index: 200;
        }
    </style>
</head>
<body>

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector">
        <div id="cat-field" class="absolute inset-0 overflow-hidden"></div>
        
        <h2 class="text-4xl font-black mb-12 text-white z-10 uppercase tracking-widest">Selecciona tu Avatar</h2>
        
        <div class="flex flex-wrap justify-center gap-8 z-10">
            {% for perfil in perfiles_activos %}
            <div class="profile-card-pixel">
                <div class="img-container">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}">
                    {% else %}
                        <div class="w-full h-full bg-slate-700 flex items-center justify-center text-3xl">🐱</div>
                    {% endif %}
                </div>
                <h3 class="text-white font-bold text-xl mb-6">{{ perfil.nombres }}</h3>
                <button onclick="minecraftExplosion(event, '{{ perfil.user.username }}')" class="btn-vibrate">
                    MIRA MI CV
                </button>
            </div>
            {% endfor %}
        </div>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center">
        <div id="canvas-3d"></div> 
        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-6xl md:text-8xl font-black mb-4 text-slate-800">
                Bienvenido a Mi CV <br>Profesional
            </h1>
            <p class="text-slate-600 text-xl md:text-2xl font-medium mb-12 max-w-2xl mx-auto">
                Trayectoria, proyectos y habilidades en una experiencia 3D.
            </p>
            <button onclick="handleCVAction()" class="px-12 py-6 bg-indigo-500 text-white rounded-full font-bold text-2xl shadow-xl hover:bg-indigo-600 transition-all active:scale-95">
                Comenzar ahora
            </button>
        </div>
    </section>

    <script>
        // --- LÓGICA DE GATOS PIXEL ---
        const catField = document.getElementById('cat-field');
        const catGifs = [
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXN6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o72EX5QZ9N9d51dq0/giphy.gif', // Caminando
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZqcGZ6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/JIX9t2j0ZTN9S/giphy.gif'   // Jugando
        ];

        for(let i=0; i<10; i++) {
            const cat = document.createElement('img');
            cat.src = catGifs[Math.floor(Math.random() * catGifs.length)];
            cat.className = 'pixel-cat';
            cat.style.left = Math.random() * 100 + '%';
            cat.style.top = Math.random() * 100 + '%';
            cat.style.transform = `scale(${0.5 + Math.random()})`;
            catField.appendChild(cat);
            
            // Movimiento aleatorio simple
            setInterval(() => {
                cat.style.left = (parseFloat(cat.style.left) + (Math.random() - 0.5) * 5) + '%';
                cat.style.top = (parseFloat(cat.style.top) + (Math.random() - 0.5) * 5) + '%';
            }, 3000);
        }

        // --- EXPLOSIÓN MINECRAFT ---
        function minecraftExplosion(e, username) {
            const rect = e.target.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'pixel-particle';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';
                p.style.backgroundColor = ['#6366f1', '#818cf8', '#ffffff', '#312e81'][Math.floor(Math.random()*4)];
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 150;
                
                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'cubic-bezier(0, .9, .57, 1)' });

                setTimeout(() => p.remove(), 600);
            }
            
            setTimeout(() => { window.location.href = "/perfil/" + username + "/"; }, 500);
        }

        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) window.location.href = "/perfil/" + user + "/";
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        // --- MOTOR 3D (MUNDO CLARO) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdbeafe); // Azul muy claro
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const colors = [0x6366f1, 0x818cf8, 0xbfdbfe];

        for(let i=0; i<40; i++) {
            const geo = [new THREE.IcosahedronGeometry(1.5), new THREE.TorusGeometry(1, 0.4, 16, 32), new THREE.BoxGeometry(2,2,2)][i%3];
            const mat = new THREE.MeshPhongMaterial({ color: colors[i%3], shininess: 100 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, (Math.random()-0.5)*20);
            mesh.userData = { velocity: new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05, (Math.random()-0.5)*0.02) };
            scene.add(mesh);
            objects.push(mesh);
        }

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        camera.position.z = 30;

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                obj.position.add(obj.userData.velocity);
                obj.rotation.x += 0.01; obj.rotation.y += 0.01;
                if (Math.abs(obj.position.x) > 35) obj.userData.velocity.x *= -1;
                if (Math.abs(obj.position.y) > 25) obj.userData.velocity.y *= -1;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
