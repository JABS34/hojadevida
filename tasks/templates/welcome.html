<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #cbd5e1; width: 100%; height: 100%; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        
        .hero-content { 
            position: relative; z-index: 10; pointer-events: none;
            text-shadow: 0 1px 4px rgba(255,255,255,0.5);
        }
        .hero-content button { pointer-events: auto; }

        /* --- SELECTOR DE PERFIL CON GATOS PIXEL --- */
        #profile-selector {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: #1e1b4b; overflow: hidden;
        }

        /* Contenedor de gatos pixelados en el fondo */
        .cat-bg {
            position: absolute; width: 60px; height: 60px;
            image-rendering: pixelated; pointer-events: none; z-index: 0;
            opacity: 0.8;
        }

        .profile-card-pixel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 3px solid #6366f1;
            border-radius: 24px;
            padding: 35px;
            width: 300px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }
        .profile-card-pixel:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(99, 102, 241, 0.4); }

        .img-container {
            width: 130px; height: 130px; margin: 0 auto 20px;
            border-radius: 50%; border: 4px solid #818cf8; overflow: hidden;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Animación Vibrante para el botón */
        .btn-vibrate {
            background: #4f46e5; color: white; padding: 14px; border-radius: 12px;
            width: 100%; font-weight: 900; letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn-vibrate:hover {
            animation: vibrate 0.15s linear infinite;
            background: #6366f1;
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(3px, -3px); }
            50% { transform: translate(-3px, 3px); }
            75% { transform: translate(3px, 3px); }
            100% { transform: translate(-3px, -3px); }
        }

        /* Partículas Pixeladas (Minecraft) */
        .pixel-block {
            position: absolute; width: 16px; height: 16px;
            pointer-events: none; z-index: 200;
        }
    </style>
</head>
<body>

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector">
        <div id="pixel-cats-container" class="absolute inset-0"></div>
        
        <h2 class="text-5xl font-black mb-16 text-white z-10 drop-shadow-lg italic">¿Quién eres hoy?</h2>
        <div class="flex flex-wrap justify-center gap-10 z-10">
            {% for perfil in perfiles_activos %}
            <div class="profile-card-pixel">
                <div class="img-container">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}">
                    {% else %}
                        <div class="w-full h-full bg-slate-800 flex items-center justify-center text-5xl">👤</div>
                    {% endif %}
                </div>
                <h3 class="text-2xl font-bold text-white mb-8">{{ perfil.nombres }}</h3>
                <button onclick="pixelExplode(event, '{{ perfil.user.username }}')" class="btn-vibrate">
                    MIRA MI CV
                </button>
            </div>
            {% endfor %}
        </div>
        <button onclick="document.getElementById('profile-selector').style.display='none'" class="mt-12 text-slate-400 hover:text-white transition-colors z-10">Cerrar Sesión</button>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center">
        <div id="canvas-3d"></div> 
        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 text-slate-800 italic">
                Bienvenido a Mi CV <br>Profesional
            </h1>
            <p class="text-slate-600 text-xl md:text-2xl font-semibold mb-12 max-w-2xl mx-auto">
                Explora mi trayectoria en un entorno digital interactivo.
            </p>
            <button onclick="handleCVAction()" class="px-14 py-7 bg-indigo-600 text-white rounded-3xl font-black text-2xl shadow-[0_12px_0_rgb(49,46,129)] hover:translate-y-1 active:translate-y-[12px] active:shadow-none transition-all">
                ACCEDER AL SISTEMA 👇
            </button>
        </div>
    </section>

    <script>
        // --- GATOS PIXELADOS (Fondo Dinámico) ---
        const catContainer = document.getElementById('pixel-cats-container');
        const catUrls = [
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pwa3N6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o72EX5QZ9N9d51dq0/giphy.gif',
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pwa3N6Znd4ZzRreW5qZzRreW5qZzRreW5qZzRreW5qZzRreSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/JIX9t2j0ZTN9S/giphy.gif'
        ];

        for(let i=0; i<12; i++){
            const cat = document.createElement('img');
            cat.src = catUrls[Math.floor(Math.random() * catUrls.length)];
            cat.className = 'cat-bg';
            cat.style.left = Math.random() * 100 + '%';
            cat.style.top = Math.random() * 100 + '%';
            catContainer.appendChild(cat);
            
            // Movimiento errático
            setInterval(() => {
                cat.style.left = (parseFloat(cat.style.left) + (Math.random() - 0.5) * 8) + '%';
                cat.style.top = (parseFloat(cat.style.top) + (Math.random() - 0.5) * 8) + '%';
            }, 2500);
        }

        // --- EXPLOSIÓN PIXELADA TIPO MINECRAFT ---
        function pixelExplode(e, username) {
            const rect = e.target.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for(let i=0; i<40; i++){
                const block = document.createElement('div');
                block.className = 'pixel-block';
                block.style.left = x + 'px';
                block.style.top = y + 'px';
                block.style.backgroundColor = ['#6366f1', '#4f46e5', '#ffffff', '#818cf8'][Math.floor(Math.random()*4)];
                document.body.appendChild(block);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                
                block.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*200}px, ${Math.sin(angle)*200}px) scale(0)`, opacity: 0 }
                ], { duration: 700, easing: 'steps(8)' });

                setTimeout(() => block.remove(), 700);
            }
            setTimeout(() => { window.location.href = "/perfil/" + username + "/"; }, 600);
        }

        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) window.location.href = "/perfil/" + user + "/";
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        // --- MOTOR 3D (COLOR CLARO + OBJETOS SÓLIDOS) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db); // Color claro
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const mats = [
            new THREE.MeshPhongMaterial({ color: 0x6366f1, shininess: 100 }),
            new THREE.MeshStandardMaterial({ color: 0x4f46e5, metalness: 0.5, roughness: 0.1 })
        ];

        for(let i=0; i<45; i++) {
            const geo = [new THREE.IcosahedronGeometry(1.5), new THREE.TorusGeometry(1, 0.4, 16, 32), new THREE.BoxGeometry(2,2,2)][i%3];
            const mesh = new THREE.Mesh(geo, mats[i%2]);
            mesh.position.set((Math.random()-0.5)*60, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
            mesh.userData = { velocity: new THREE.Vector3((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.03) };
            scene.add(mesh);
            objects.push(mesh);
        }

        // Iluminación para resaltar el 3D
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        camera.position.z = 35;

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                obj.position.add(obj.userData.velocity);
                obj.rotation.x += 0.01; obj.rotation.y += 0.01;
                if (Math.abs(obj.position.x) > 40) obj.userData.velocity.x *= -1;
                if (Math.abs(obj.position.y) > 30) obj.userData.velocity.y *= -1;
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
