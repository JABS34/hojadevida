<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mi CV Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; width: 100%; height: 100%; }
        #canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; cursor: grab; }
        #canvas-3d:active { cursor: grabbing; }
        
        .hero-content { 
            position: relative; z-index: 10; pointer-events: none;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .hero-content button { pointer-events: auto; }

        /* --- SELECTOR DE PERFIL MEJORADO --- */
        #profile-selector {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: #020617;
            overflow: hidden;
        }

        /* Efecto Linterna / Destello */
        .flashlight-spark {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 40px 20px rgba(255, 255, 255, 0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card-pixel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 30px;
            padding: 40px;
            width: 320px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .profile-card-pixel:hover { 
            transform: scale(1.05); 
            border-color: #6366f1; 
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .img-container {
            width: 140px; height: 140px; margin: 0 auto 25px;
            border-radius: 50%; border: 4px solid #6366f1; overflow: hidden;
            background: #1e293b; display: flex; align-items: center; justify-content: center;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-vibrate {
            background: #6366f1; color: white; padding: 14px; border-radius: 12px;
            width: 100%; font-weight: 900; transition: all 0.2s;
        }
        .btn-vibrate:hover { animation: vibrate 0.1s linear infinite; background: #4f46e5; }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }

        .emoji-particle { position: absolute; pointer-events: none; z-index: 200; font-size: 2.5rem; animation: floatUp 0.8s ease-out forwards; }
        .pixel-particle { position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 200; }

        @keyframes floatUp {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translateY(-150px) rotate(45deg); opacity: 0; }
        }

        @keyframes flashAnim {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.3; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2); }
        }
    </style>
</head>
<body>

    <input type="hidden" id="total-activos" value="{{ total_activos|default:0 }}">
    <input type="hidden" id="username-unico" value="{{ username_unico }}">

    <div id="profile-selector">
        <div id="spark-container" class="absolute inset-0"></div>
        <h2 class="text-5xl font-black mb-16 text-white z-10 italic tracking-tighter">SELECCIONA TU PERFIL</h2>
        <div class="flex flex-wrap justify-center gap-10 z-10">
            {% for perfil in perfiles_activos %}
            <div class="profile-card-pixel">
                <div class="img-container">
                    {% if perfil.foto %}
                        <img src="{{ perfil.foto.url }}" alt="Foto">
                    {% else %}
                        <div class="text-5xl">👤</div>
                    {% endif %}
                </div>
                <h3 class="text-2xl font-bold text-white mb-8 tracking-tight">{{ perfil.nombres }}</h3>
                <button onclick="mineExplode(event, '{{ perfil.user.username }}')" class="btn-vibrate uppercase tracking-widest text-sm">MIRA MI CV</button>
            </div>
            {% endfor %}
        </div>
        <button onclick="document.getElementById('profile-selector').style.display='none'" class="mt-12 text-slate-500 hover:text-white transition-colors z-10 font-bold uppercase text-xs tracking-widest">VOLVER AL INICIO</button>
    </div>

    <section id="hero-main" class="relative w-screen h-screen flex flex-col items-center justify-center text-center overflow-hidden">
        <div id="canvas-3d"></div> 
        <div class="hero-content" id="ui-wrapper">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white to-indigo-500 select-none italic">
                Bienvenido a Mi CV <br>Profesional
            </h1>
            <p class="text-slate-300 text-xl md:text-2xl font-medium mb-12 max-w-2xl mx-auto select-none italic">
                Lanza los objetos y explora mi mundo digital.
            </p>
            <button onclick="handleCVAction()" class="px-14 py-7 bg-indigo-600 text-white rounded-3xl font-black text-2xl shadow-[0_12px_0_rgb(49,46,129)] hover:translate-y-1 active:translate-y-[12px] active:shadow-none transition-all">
                EMPEZAR 👇
            </button>
        </div>
    </section>

    <script>
        // --- EFECTO DE DESTELLOS TIPO LINTERNILLA ---
        function createSpark() {
            const container = document.getElementById('spark-container');
            if (document.getElementById('profile-selector').style.display === 'flex') {
                const spark = document.createElement('div');
                spark.className = 'flashlight-spark';
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                spark.style.left = x + '%';
                spark.style.top = y + '%';
                spark.style.animation = `flashAnim ${1 + Math.random() * 2}s ease-in-out forwards`;
                
                container.appendChild(spark);
                setTimeout(() => spark.remove(), 3000);
            }
        }
        setInterval(createSpark, 600);

        // --- EXPLOSIONES ---
        function emojiExplode(x, y) {
            const emojis = ['🔥', '💻', '⚡', '✨', '🚀', '⭐', '💎'];
            for(let i=0; i<10; i++){
                const e = document.createElement('span');
                e.className = 'emoji-particle';
                e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
                e.style.left = x + 'px'; e.style.top = y + 'px';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 800);
            }
        }

        function mineExplode(e, user) {
            const r = e.target.getBoundingClientRect();
            const x = r.left + r.width/2; const y = r.top + r.height/2;
            for(let i=0; i<30; i++){
                const b = document.createElement('div');
                b.className = 'pixel-particle';
                b.style.left = x + 'px'; b.style.top = y + 'px';
                b.style.backgroundColor = ['#6366f1', '#ffffff', '#4f46e5'][Math.floor(Math.random()*3)];
                document.body.appendChild(b);
                const a = Math.random()*Math.PI*2; const d = 120+Math.random()*160;
                b.animate([{transform:'translate(0,0) scale(1)', opacity:1},{transform:`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px) scale(0)`, opacity:0}], {duration:600, easing:'steps(5)'});
                setTimeout(() => b.remove(), 600);
            }
            setTimeout(() => window.location.href = "/perfil/" + user + "/", 550);
        }

        function handleCVAction() {
            const total = parseInt(document.getElementById('total-activos').value);
            const user = document.getElementById('username-unico').value;
            if (total === 1) window.location.href = "/perfil/" + user + "/";
            else document.getElementById('profile-selector').style.display = 'flex';
        }

        // --- MOTOR 3D ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-3d').appendChild(renderer.domElement);

        const objects = [];
        const indigoMat = new THREE.MeshPhongMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.4 });
        
        const partGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(2000 * 3);
        for(let i=0; i < 2000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 120;
        partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        scene.add(new THREE.Points(partGeo, new THREE.PointsMaterial({ color: 0x818cf8, size: 0.04 })));

        function createCodeBlock(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = '#6366f1'; ctx.font = 'Bold 44px monospace';
            ctx.fillText(text, 20, 80);
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            return new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5), mat);
        }

        const codes = [];
        // Lógica de visibilidad controlada desde Django Admin
        {% if config.mostrar_garage %} codes.push("VENTA GARAGE"); {% endif %}
        {% if config.mostrar_cursos %} codes.push("CURSOS REALIZADOS"); {% endif %}
        {% if config.mostrar_reconocimientos %} codes.push("RECONOCIMIENTOS"); {% endif %}
        
        // Si no hay ninguno activo, ponemos códigos por defecto para que no se vea vacío
        if (codes.length === 0) {
            codes.push("python manage.py", "git push origin", "npm run dev");
        }

        for(let i=0; i<40; i++) {
            let obj;
            if(i < 15) obj = createCodeBlock(codes[i % codes.length]);
            else {
                const geo = i % 2 === 0 ? new THREE.IcosahedronGeometry(Math.random()*1.5 + 1, 0) : new THREE.TorusGeometry(1.2, 0.4, 12, 24);
                obj = new THREE.Mesh(geo, indigoMat);
            }
            obj.position.set((Math.random()-0.5)*60, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
            obj.userData = { 
                velocity: new THREE.Vector3((Math.random()-0.5)*0.15, (Math.random()-0.5)*0.15, (Math.random()-0.5)*0.05),
                isDragging: false 
            };
            scene.add(obj);
            objects.push(obj);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        scene.add(new THREE.PointLight(0x6366f1, 2, 100));
        camera.position.z = 35;

        const drag = new THREE.DragControls(objects, camera, renderer.domElement);
        drag.addEventListener('dragstart', (e) => { e.object.userData.isDragging = true; });
        drag.addEventListener('drag', (e) => { e.object.userData.velocity.set((Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8, 0); });
        drag.addEventListener('dragend', (e) => { e.object.userData.isDragging = false; });

        window.addEventListener('mousedown', (e) => {
            const ray = new THREE.Raycaster();
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            ray.setFromCamera(mouse, camera);
            const inter = ray.intersectObjects(objects);
            if(inter.length > 0) {
                emojiExplode(e.clientX, e.clientY);
                inter[0].object.userData.velocity.set((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*1);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                if(!obj.userData.isDragging) {
                    obj.position.add(obj.userData.velocity);
                    obj.rotation.x += 0.01; obj.rotation.y += 0.01;
                    if (Math.abs(obj.position.x) > 45) obj.userData.velocity.x *= -1;
                    if (Math.abs(obj.position.y) > 35) obj.userData.velocity.y *= -1;
                    obj.userData.velocity.multiplyScalar(0.995);
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
