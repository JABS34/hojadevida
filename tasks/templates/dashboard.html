{% extends 'base.html' %}
{% block content %}
<main class="animate__animated animate__fadeInUp pb-10">
    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-br from-indigo-600 to-blue-800 p-10 text-white">
            <h1 class="text-4xl font-extrabold tracking-tight">Panel de Control</h1>
            <p class="opacity-80 font-medium mt-2">Gestiona tu perfil profesional y tu tienda de forma dinámica.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-10 space-y-10">
            {% csrf_token %}
            
            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Foto de Perfil</label>
                    <input type="file" name="foto" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 transition border border-slate-100 p-2 rounded-2xl">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Instagram (Usuario)</label>
                    <input type="text" name="instagram" value="{{ perfil.instagram|default:'' }}" placeholder="ej: jabs6393" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl outline-none font-semibold">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Nombres</label>
                    <input type="text" name="nombres" value="{{ perfil.nombres }}" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl outline-none font-semibold">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Apellidos</label>
                    <input type="text" name="apellidos" value="{{ perfil.apellidos }}" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl outline-none font-semibold">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Descripción Profesional</label>
                <textarea name="descripcionperfil" rows="4" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none italic">{{ perfil.descripcionperfil }}</textarea>
            </div>

            <div class="bg-slate-50 p-8 rounded-[2rem] border border-slate-200">
                <h3 class="font-black text-indigo-600 mb-6 uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i class="fas fa-briefcase"></i> Agregar Experiencia Laboral
                </h3>
                <div class="grid md:grid-cols-2 gap-4 mb-4">
                    <input type="text" name="exp_puesto" placeholder="Puesto" class="p-3 border rounded-xl text-sm font-semibold">
                    <input type="text" name="exp_empresa" placeholder="Empresa" class="p-3 border rounded-xl text-sm font-semibold">
                </div>
                <textarea name="exp_desc" placeholder="Descripción..." rows="2" class="w-full p-3 border rounded-xl text-sm font-semibold"></textarea>
            </div>

            <div class="bg-slate-50 p-8 rounded-[2rem] border border-slate-200">
                <h3 class="font-black text-amber-600 mb-6 uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i class="fas fa-award"></i> Agregar Reconocimiento
                </h3>
                <div class="grid md:grid-cols-2 gap-4 mb-4">
                    <input type="text" name="rec_titulo" placeholder="Título" class="p-3 border rounded-xl text-sm font-semibold">
                    <input type="text" name="rec_inst" placeholder="Institución" class="p-3 border rounded-xl text-sm font-semibold">
                    <input type="date" name="rec_fecha" class="p-3 border rounded-xl text-sm font-semibold">
                    <input type="file" name="rec_imagen" class="p-2 border rounded-xl text-xs">
                </div>
                <textarea name="rec_desc" placeholder="Breve descripción..." rows="2" class="w-full p-3 border rounded-xl text-sm font-semibold"></textarea>
            </div>

            <div class="bg-emerald-50 p-8 rounded-[2rem] border border-emerald-100">
                <h3 class="font-black text-emerald-700 mb-6 uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i class="fas fa-store"></i> Publicar en Garage Store
                </h3>
                <div class="grid md:grid-cols-2 gap-4 mb-4">
                    <input type="text" name="prod_nombre" placeholder="Producto" class="p-3 border rounded-xl text-sm font-semibold">
                    <input type="number" step="0.01" name="prod_precio" placeholder="Precio" class="p-3 border rounded-xl text-sm font-semibold">
                    <select name="prod_estado" class="p-3 border rounded-xl text-sm font-semibold bg-white">
                        <option value="Nuevo">Nuevo</option>
                        <option value="Medio Usado">Medio Usado</option>
                        <option value="Usado">Usado (Buen Estado)</option>
                    </select>
                    <input type="file" name="prod_imagen" class="p-2 border rounded-xl text-xs bg-white">
                </div>
                <textarea name="prod_desc" placeholder="Descripción del producto..." rows="2" class="w-full p-3 border rounded-xl text-sm font-semibold"></textarea>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition shadow-2xl flex items-center justify-center gap-3 tracking-widest">
                GUARDAR TODO <i class="fas fa-save"></i>
            </button>
        </form>
    </div>
</main>
{% endblock %}
