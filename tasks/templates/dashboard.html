{% extends 'base.html' %}
{% block content %}
<main class="animate__animated animate__fadeInUp">
    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-br from-blue-700 to-indigo-900 p-10 text-white relative overflow-hidden">
            <div class="relative z-10">
                <h1 class="text-4xl font-extrabold tracking-tight">Centro de Control</h1>
                <p class="text-blue-100 mt-2 font-medium">Configura tu identidad profesional digital.</p>
            </div>
            <i class="fas fa-cog absolute -right-10 -bottom-10 text-[12rem] opacity-10 rotate-12"></i>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-10 space-y-10">
            {% csrf_token %}
            
            <div class="grid md:grid-cols-2 gap-8">
                <div class="group">
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Foto de Perfil</label>
                    <div class="relative">
                        <input type="file" name="foto" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Instagram</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400">@</span>
                        <input type="text" name="instagram" value="{{ perfil.instagram }}" placeholder="usuario" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none font-semibold text-slate-700">
                    </div>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Nombres</label>
                    <input type="text" name="nombres" value="{{ perfil.nombres }}" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Apellidos</label>
                    <input type="text" name="apellidos" value="{{ perfil.apellidos }}" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none font-semibold">
                </div>
            </div>

            <div class="bg-blue-50/50 p-8 rounded-[1.5rem] border border-blue-100">
                <h3 class="font-black text-blue-700 mb-6 uppercase text-[10px] tracking-[0.2em] flex items-center gap-2">
                    <i class="fas fa-layer-group"></i> Tu Stack Tecnológico
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {% for lang in lenguajes_disponibles %}
                    <label class="flex items-center gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-500 hover:shadow-md transition group">
                        <input type="checkbox" name="lenguajes" value="{{ lang }}" class="w-5 h-5 rounded-md border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span class="text-xs font-bold text-slate-600 group-hover:text-blue-700">{{ lang }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="group relative w-full bg-slate-900 text-white font-black py-5 rounded-[1.2rem] hover:bg-blue-600 transition-all duration-300 shadow-2xl overflow-hidden">
                <span class="relative z-10 flex items-center justify-center gap-3">
                    ACTUALIZAR Y LANZAR CV <i class="fas fa-rocket animate__animated animate__infinite animate__pulse"></i>
                </span>
                <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </button>
        </form>
    </div>
</main>
{% endblock %}
