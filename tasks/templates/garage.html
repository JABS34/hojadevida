<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Garage Sale | {{ username }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans">
    <nav class="bg-white shadow-md p-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-900 italic uppercase tracking-tighter">Mi Garage Store</h1>
            <a href="{% url 'profile_cv' username %}" class="text-blue-600 font-bold hover:underline">
                <i class="fas fa-arrow-left"></i> Volver al CV
            </a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for producto in productos %}
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200 hover:shadow-2xl transition">
                {% if producto.imagen %}
                    <img src="{{ producto.imagen.url }}" class="w-full h-48 object-cover">
                {% else %}
                    <div class="w-full h-48 bg-slate-200 flex items-center justify-center text-slate-400">
                        <i class="fas fa-box-open text-4xl"></i>
                    </div>
                {% endif %}
                
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-slate-800 uppercase text-sm">{{ producto.nombre }}</h3>
                        <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-md">
                            ${{ producto.precio }}
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 mb-4">Estado: <span class="font-semibold">{{ producto.estado }}</span></p>
                    <button class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold text-xs hover:bg-blue-700 transition">
                        CONTACTAR VENDEDOR
                    </button>
                </div>
            </div>
            {% empty %}
            <div class="col-span-full text-center py-20">
                <i class="fas fa-store-slash text-5xl text-slate-300 mb-4"></i>
                <p class="text-slate-500 font-medium">No hay productos disponibles en este momento.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
